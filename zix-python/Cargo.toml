[package]
name = "zix-pyo3"
version = "0.0.0"
edition = "2024"

[lib]
name = "zix"
crate-type = [
    "cdylib",
    "rlib",   # Required by gen_pyi
]

[dependencies]
pyo3 = "0.28"
zix_core = { package = "zix", path = "../zix" }
numpy = "0.28"
pyo3-stub-gen = "0.21"
arrayvec = "0.7"

[dev-dependencies]
ctor = "0.8"
