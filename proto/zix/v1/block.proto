syntax = "proto3";

package zix.v1;

import "zix/v1/dtype.proto";
import "zix/v1/structure.proto";

message BlockTable {
    Dtype dtype = 1;
    uint64 nitems = 2;
    uint64 block_size = 3;
    Section cdata = 4;
    Section block_offsets = 5;
}

