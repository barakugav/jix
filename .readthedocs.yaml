version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "1.91"
  jobs:
    post_install:
      - cd jix-py && pip install -e .
      - cd jix-py && maturin generate-stubs --out python

mkdocs:
  configuration: jix-py/mkdocs.yml

python:
  install:
    - requirements: scripts/dev_requirements.txt
