# The units of the docs review.
#
# A unit is the share of one scanner agent. Every file is in the `edit` list of exactly one unit,
# so scanners can run in parallel without touching the same file.
#
#   id       name of the unit, also the subject of its commit
#   context  context packs to read besides general.md and api_index.md (scripts/docs_review/context/)
#   edit     files the scanner may change
#   read     files to consult for cross-checking, read-only
#   notes    unit-specific guidance
#
# Three kinds of units:
#   - op families pair the Rust file with its Python counterpart, so the two sets of docs are
#     checked against each other;
#   - core modules are grouped by module;
#   - "overview" holds every landing page, since they share text that must stay in sync.
#
# Out of scope: plain // comments, generated code (jix/src/archive/schema/_proto_gen), the .proto
# files (their comments end up in generated code), tests and benches directories, scripts/,
# CLAUDE.md, todo.md.

# ----------------------------------------------------------------------------------------------
# Package level
# ----------------------------------------------------------------------------------------------

[[unit]]
id = "overview"
pilot = true
context = ["python"]
edit = [
    "README.md",
    "jix/README.md",
    "jix-py/README.md",
    "jix-macros/README.md",
    "jix-py/docs/index.md",
    "jix-py/docs/module.md",
    "jix-py/docs/about.md",
    "docs/benchmarks.md",
    "THANKS.md",
    "jix/src/lib.rs",
    "jix-py/src/lib.rs",
    "jix/src/ops/mod.rs",
]
read = ["jix/src/storage/mod.rs", "jix/src/array/mod.rs", "jix-py/src/array.rs", "jix-py/python/jix/__init__.py"]
notes = """
These pages repeat each other on purpose: crates.io, PyPI and the docs site each show one of them
alone. jix-py/README.md is a copy of the top of jix-py/docs/index.md, and the "When should I use
this library?" section appears in five files. Do not remove a passage because another page has
it. Keep the copies in sync instead: a fix made to one copy goes to every copy. Within a single
page, the redundancy rule applies as usual.
Check every example against the current API (api_index.md), and every claim about what the
library does against the code.
"""

