syntax = "proto3";

package jix.v1;

message FileMetadata {
  ArchiveType archive_type = 1;
  Semver lib_version = 2;
}

message Semver {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string pre_release = 4;
  string build_metadata = 5;
}

enum ArchiveType {
  ARCHIVE_TYPE_UNSPECIFIED = 0;
  ARCHIVE_TYPE_BLOCK_TABLE = 1;
  ARCHIVE_TYPE_ARRAY_V1 = 2;
}
