[package]
name = "jix-probe-elementwise"
version = "0.0.0"
edition = "2024"
publish = false
description = "Asm probe for jix's element-wise pipeline, for cargo-asm + llvm-mca"

[lib]
# rlib only: `cargo asm` needs no linker.
crate-type = ["rlib"]

[dependencies]
jix = { path = "../.." }
ndarray = ">=0.16,<0.18"
