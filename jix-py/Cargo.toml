[package]
name = "jix-python"
version = "0.0.3"
authors = ["Barak Ugav <barakugav@gmail.com>"]
edition = "2024"
rust-version = "1.89.0"
description = "Multi-dimensional array library with block-compressed storage and lazy-evaluated operations"
readme = "README.md"
repository = "https://github.com/barakugav/jix"
license = "MIT OR Apache-2.0"
keywords = ["ndarray", "compression", "zstd"]
categories = ["data-structures", "compression", "science"]

[lib]
name = "jix"
crate-type = [
    "cdylib",
    "rlib",   # Required by generate_pyi
]

[dependencies]
pyo3 = "0.29"
jix_core = { package = "jix", path = "../jix", version = "=0.0.3", features = [
    "half",
    "num-complex",
    "multiversion",
] }
numpy = { version = "0.29", features = ["half"] }
num-traits = "0.2"
pyo3-stub-gen = "0.23.0"
arrayvec = "0.7"
ndarray = "0.17.0"

[dev-dependencies]
ctor = "1"
