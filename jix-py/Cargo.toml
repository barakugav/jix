[package]
name = "jix-python"
version = "0.0.6"
authors = ["Barak Ugav <barakugav@gmail.com>"]
edition = "2024"
rust-version = "1.89.0"
description = "Multi-dimensional array library with block-compressed storage and lazy-evaluated operations"
readme = "README.md"
repository = "https://github.com/barakugav/jix"
license = "MIT OR Apache-2.0"
keywords = ["ndarray", "compression", "zstd"]
categories = ["data-structures", "compression", "science"]

[lib]
name = "jix"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["experimental-inspect"] }
jix_core = { package = "jix", path = "../jix", version = "=0.0.6", features = [
    "half",
    "num-complex",
] }
numpy = { version = "0.30", features = ["half"] }
arrayvec = "0.7"
ndarray = "0.17.0"

[dev-dependencies]
ctor = "1"
